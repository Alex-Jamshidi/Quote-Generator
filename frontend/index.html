<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <script type="module" src="frontend.mjs"></script>
  </head>
  <body>
    <h1>Quote</h1>
    <p id="quote"></p>
    <p id="author"></p>
    <button type="button" id="new-quote">New quote</button>

    <br><br>

    <form>
      <h2>Add New Quote</h1>
      <label for="quote-input">Quote:</label>
      <input type="text" id="quote-input"></input>
      <label for="author-input">Author:</label>
      <input type="text" id="author-input"></input>
    <button type="button" id="add-quote">Add quote</button>
    <p id="output-message"></p>
    </form>
  </body>
</html>
